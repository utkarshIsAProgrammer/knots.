name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Knots APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Application
        run: |
          cd client
          npm ci || npm install
          npm run build
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x client/android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk Knots.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knots-APK
          path: Knots.apk
          if-no-files-found: error

      - name: Publish Knots APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0-mobile
          name: "Knots Android App (v1.0)"
          body: |
            ### 📱 Knots Android APK
            
            Installable standalone Android mobile app for Knots.
            
            #### How to Install:
            1. Download **`Knots.apk`** below directly on your Android phone.
            2. Tap the file in your downloads to install.
            3. Grant permissions for Voice Notes & Camera when requested.
            4. Connect to your backend relay at any time by typing `//server <your-url>` in the chat.
          files: Knots.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
